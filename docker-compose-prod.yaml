version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    container_name: studybuddy_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads

  db:
    image: postgres:16
    container_name: studybuddy_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backup:
    image: postgres:16
    container_name: studybuddy_backup
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backups:/backups
    command: |
      sh -c "
        export PGPASSWORD=\"\$${POSTGRES_PASSWORD}\";
        until pg_isready -h db -U \"\$${POSTGRES_USER}\"; do
          sleep 2;
        done;
        while true; do
          pg_dump -h db -U \"\$${POSTGRES_USER}\" \"\$${POSTGRES_DB}\" > /backups/studybuddy-\$(date +%Y-%m-%d_%H-%M-%S).sql;
          find /backups -name '*.sql' -mtime +7 -delete;
          sleep 86400;
        done
      "
volumes:
  postgres_data:
  uploads_data: